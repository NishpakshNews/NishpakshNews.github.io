<style>
  /* nishpaksh_version_1.0 (owner, Oct 8 2026): one card at a time, the card grows into the article.

  :root {

  }

  /* the deck: one card at a time, swiped up and down, looping */
  #deck { flex: 1; min-height: 0; position: relative; }

  .card:active { transform: scale(0.985); }

  .loading .bone { background: #efefec; border-radius: 8px; height: 18px; margin: 0 0 12px; }

  /* sentence colours */
  .s.established, .s.corroborated, .s.confirmed { color: var(--est); }
  .s.developing { color: var(--dev); text-decoration: underline dotted #7fc4bb; text-underline-offset: 4px; }
  .s.unverified, .s.pending { color: var(--unv); }
  .s.single { color: var(--one); }
  .s.partial { color: var(--par); }
  .s.disputed { color: var(--dis); }
  .s.false { color: var(--fal); }
  .ftag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: #fff; background: var(--fal);
          border-radius: 4px; padding: 1px 5px; margin-right: 5px; vertical-align: 2px; }

  /* the article: a sheet that grows out of the card */
  #sheet { position: fixed; inset: 0; z-index: 10; background: var(--card); visibility: hidden; }
  #sheet.on { visibility: visible; }
  /* optimisation pass (owner, Oct 16 2026): the sheet is never clipped. Animating clip-path is done on the main thread
     and repainted the whole article every frame, while the picture and the headline glided on the GPU: when the page was
     busy the two fell out of step (a white rectangle over the picture, the card flashing through). Now the sheet is
     transparent and a plain plate (#plate) grows from the card to the screen by transform, on the GPU like everything
     else that moves; the plate is white like the card, then the page's ground. */
  #sheet { background: transparent; }
  #plate { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; background: var(--ground); border-radius: 0; }
  #plate i { position: absolute; inset: 0; border-radius: inherit; background: var(--card); opacity: 1; }
  #sheet.open #plate i { opacity: 0; }
  #sheet.anim #plate i { transition: opacity 220ms ease; }
  /* closing: the sheet fades away over the last 200 ms (the headline and picture are already over the card's), so the
     card's body text and heading come in by crossfade instead of appearing all at once when the sheet is removed */
  /* Flash fix (owner, Oct 16 2026: the screen flashed white at the start of the opening and during the closing).
     Opening: on a phone the sheet was shown one frame before its start position reached the GPU, so the plate filled the
     screen in white for a frame. Now the start position is also set as plain styles, and the sheet is first drawn at
     almost no opacity (.pre without .anim) so its layers are rasterised while the card still shows; then it appears.
     Closing: the article's text left at once while the white plate covered the card, and the card's own text came back only
     when the sheet faded at the end (a blank white card). Now the plate fades away first and the card stays visible
     underneath, only its picture, headline, kicker and bar hidden (.under) while the article's glide into their places;
     at the end the card's copy comes back at once UNDER the article's (they are identical, so it is not seen) and only the
     article's fades (#sheet.gone): crossfading the two let the white through for a few frames (owner, Oct 17 2026: the bar
     went pale and the picture whitened at the hand-over). */
  #sheet.pre:not(.anim) { opacity: 0.01; }
  #sheet.leaving #plate { opacity: 0; transition: opacity 180ms ease; }
  #sheet.leaving #plate i { opacity: 0; transition: none; }
  #sheet.gone { opacity: 0; transition: opacity 130ms ease; }
  a.card.under .pic, a.card.under h2, a.card.under .kk, a.card.under .edge { opacity: 0; transition: none; }
  .sheet-scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; touch-action: pan-y pinch-zoom; overscroll-behavior: contain; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .sheet-scroll::-webkit-scrollbar { display: none; }
  .col { max-width: 560px; margin: 0 auto; padding: 0 max(14px, env(safe-area-inset-right)) 48px max(14px, env(safe-area-inset-left)); }
  /* the article's top stays (owner, Oct 9 2026, canvas "Article · Calm + tiles + quotes + rail"): back | wordmark |
     language, the wordmark where and as big as on the home page, in the home page's indigo; under it the article's
     sections (the one being read is filled; tap to go) and a line in the same indigo that fills as you read */
  .chrome { position: sticky; top: 0; z-index: 3; margin: 0 calc(-1 * max(14px, env(safe-area-inset-left))); opacity: 0;
            padding: calc(max(14px, env(safe-area-inset-top)) + 7px) max(14px, env(safe-area-inset-right)) 0 max(14px, env(safe-area-inset-left));
            transition: background-color 240ms ease, box-shadow 240ms ease; }
  .chrome.stuck { background: rgba(244,244,241,0.94); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); box-shadow: 0 1px 0 rgba(0,0,0,0.06); }
  .crow { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; height: 44px; margin-bottom: 10px; }
  .crow > :first-child { justify-self: start; }
  .crow > :last-child { justify-self: end; }
  #sheet.anim .chrome { transition: opacity 260ms ease 220ms, background-color 240ms ease, box-shadow 240ms ease; }
  #sheet.open .chrome { opacity: 1; }
  .wm-ink { background: linear-gradient(135deg, #46549a 0%, #2f3a72 45%, #1f2550 75%, #161a38 100%); -webkit-background-clip: text;
            background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
  /* faded edges (owner, Oct 14 2026): the rail runs out to both screen ends and its names melt into the header there;
     a side fades only while there is more to scroll to on that side (--fl / --fr, set by railFade) */
  @property --fl { syntax: "<length>"; inherits: false; initial-value: 0px; }
  @property --fr { syntax: "<length>"; inherits: false; initial-value: 0px; }
  .rail { --fl: 0px; --fr: 0px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
          margin: 0 calc(-1 * max(14px, env(safe-area-inset-left))); padding: 0 max(14px, env(safe-area-inset-right)) 9px max(14px, env(safe-area-inset-left));
          -webkit-mask-image: linear-gradient(to right, transparent 0, #000 var(--fl), #000 calc(100% - var(--fr)), transparent 100%);
          mask-image: linear-gradient(to right, transparent 0, #000 var(--fl), #000 calc(100% - var(--fr)), transparent 100%);
          transition: --fl 260ms ease, --fr 260ms ease; }
  .rail::-webkit-scrollbar { display: none; }
  .rail:empty { display: none; }
  .rail button { flex: none; border: 0; border-radius: 999px; padding: 6px 12px; min-height: 32px; font-size: 13px; font-weight: 600; cursor: pointer;
                 background: #fff; color: var(--ink-soft); box-shadow: 0 2px 0 var(--edge); transition: background-color 220ms ease, color 220ms ease; }
  .rail button.on { background: #2f3a72; color: #fff; box-shadow: none; }
  .readline { height: 3px; margin: 0 calc(-1 * max(14px, env(safe-area-inset-left))); background: rgba(0,0,0,0.05); }
  .readline i { display: block; height: 100%; background: linear-gradient(90deg, #46549a 0%, #2f3a72 45%, #1f2550 75%, #161a38 100%);
                clip-path: inset(0 100% 0 0); }
  .back { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; border: 0;
          background: #fff; box-shadow: 0 2px 0 var(--edge); cursor: pointer; }
  .chrome .wordmark { font-size: 23px; }
  html.hi .chrome .wordmark { font-size: 26px; }
  /* opening and closing move only the headline and the picture, by transform (owner, Oct 9 2026: jitter on two
     Android phones while padding, width and height were animated): the box keeps its open layout throughout, the
     headline and the picture start over the card's (--tx/--ty, --pt, measured) and glide home; the rest fades */
  .hbox { position: relative; margin-top: 14px; border-radius: 22px; color: var(--ink); padding: 18px; }
  .hbox.has-pic { padding-top: 150px; }
  .hbox .layer { position: absolute; inset: 0; border-radius: 22px; opacity: 0; }
  #sheet.anim .hbox { transition: color 320ms ease 120ms; }
  #sheet.anim .hbox .layer { transition: opacity 340ms ease 100ms; }
  #sheet.open .hbox { color: #fff; }
  #sheet.open .hbox .layer { opacity: 1; }
  .hbox h1 { transform: translate(var(--tx, 0px), var(--ty, 0px)); }
  #sheet.anim .hbox h1 { transition: transform 460ms var(--ease); will-change: transform; }
  #sheet.open .hbox h1 { transform: none; text-shadow: 0 1px 2px rgba(0,0,0,0.35), 0 0 18px rgba(0,0,0,0.18); }
  /* the picture at the top of the indigo box, dissolving into it; the card's and the article's are one picture */
  .hbox .hpic { position: absolute; left: 0; right: 0; top: 0; height: 200px; border-radius: 22px 22px 0 0; overflow: hidden;
                opacity: 0; display: none; transform-origin: 0 0; }
  .hbox.has-pic .hpic { display: block; }
  .hbox.morph .hpic { opacity: 1; }
  /* the image is laid out at its whole cover size (fitPic) and moved by its own transform, so on the way into and out
     of the card it is at exactly the card's zoom and crop: no zoom-in then snap (owner, Oct 10 2026) */
  /* Oct 11 2026 (second pass): the picture is made like the card's, in three layers that only ever change by OPACITY
     (compositor-only, so no per-frame repaint = no jitter): .hsoft (the blurred copy and the white wash, its own bottom
     feathered out so no hard edge shows), .s1 (the sharp copy with the card's mask) and .s2 (the sharp copy with the
     article's longer mask, dissolving into the indigo). Nothing is blurred or masked by an animated value any more
     (before: animated mask stops and a moving blurred copy made a band of blur travel through the picture). The sharp
     copies overlap, so the picture's top never dips while one goes in and the other out. */
  .hbox .hpic .hsoft { position: absolute; inset: 0; opacity: 1;
                       -webkit-mask-image: linear-gradient(to bottom, #000 68%, transparent 100%); mask-image: linear-gradient(to bottom, #000 68%, transparent 100%); }
  .hbox .hpic .hsharp { position: absolute; inset: 0; }
  .hbox .hpic .hsharp.s1 { opacity: 1; -webkit-mask-image: linear-gradient(to bottom, #000 76%, transparent 94%); mask-image: linear-gradient(to bottom, #000 76%, transparent 94%); }
  .hbox .hpic .hsharp.s2 { opacity: 0; -webkit-mask-image: linear-gradient(to bottom, #000 45%, transparent 100%); mask-image: linear-gradient(to bottom, #000 45%, transparent 100%); }
  #sheet.open .hbox .hpic .hsoft { opacity: 0; }
  #sheet.open .hbox .hpic .hsharp.s1 { opacity: 0; }
  #sheet.open .hbox .hpic .hsharp.s2 { opacity: 1; }
  #sheet.anim .hbox .hpic .hsoft { transition: opacity 340ms ease 140ms; }
  #sheet.anim .hbox .hpic .hsharp.s1 { transition: opacity 240ms ease 240ms; }
  #sheet.anim .hbox .hpic .hsharp.s2 { transition: opacity 300ms ease; }
  #sheet.anim:not(.open) .hbox .hpic .hsoft { transition: opacity 300ms ease 100ms; }
  #sheet.anim:not(.open) .hbox .hpic .hsharp.s1 { transition: opacity 240ms ease; }
  #sheet.anim:not(.open) .hbox .hpic .hsharp.s2 { transition: opacity 260ms ease 200ms; }
  .hbox .hpic img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; display: block; transform-origin: 50% 50%; }
  .hbox .hpic img.soft { filter: blur(var(--bl, 16px)) saturate(1.1); transform: scale(1.15); }
  /* (the picture's box and images are moved by the morph's own animations: see "one motion" in the script) */
  .hbox .hpic .hwash { position: absolute; inset: 0; pointer-events: none;
                       background: linear-gradient(to bottom, rgba(255,255,255,0) 74%, rgba(255,255,255,0.55) 89%, #fff 100%); }
  .hbox .hpic .pic-credit { opacity: 0; }
  #sheet.anim .hbox .hpic { transition: opacity 340ms ease 100ms; }
  #sheet.anim .hbox .hpic .pic-credit { transition: opacity 220ms ease 300ms; }
  #sheet.open .hbox .hpic { opacity: 1; transform: none; }
  #sheet.open .hbox .hpic .pic-credit { opacity: 1; }
  .pic-credit { position: absolute; top: 10px; right: 12px; font-size: 11px; font-weight: 500; color: #fff; background: rgba(10,12,30,0.42);
                padding: 3px 8px; border-radius: 999px; text-decoration: none; }
  .hbox h1 { position: relative; margin: 0; max-width: var(--hw, none); font-family: var(--head); font-weight: 600; font-size: 27px; line-height: 1.15; letter-spacing: -0.005em; }
  html.hi .hbox h1 { font-size: 24px; line-height: 1.45; letter-spacing: 0; }
  .hbox .meta { position: relative; margin-top: 10px; font-size: 13px; opacity: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  /* share (owner, Oct 9 2026): at the right of the sources and time line */
  /* the size of the line's text: a bare icon; the touch area stays 36px through padding and negative margins */
  .share { flex: none; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; margin: -10px -10px -10px 0;
           border: 0; border-radius: 50%; background: transparent; color: #fff; cursor: pointer; transition: background-color 160ms ease; }
  .share:active { background: rgba(255,255,255,0.16); }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 20; transform: translate(-50%, 12px); opacity: 0;
           background: #1f2550; color: #fff; font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 999px; pointer-events: none;
           box-shadow: 0 6px 18px rgba(22,26,56,0.25); transition: opacity 200ms ease, transform 260ms var(--ease); }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  /* the refresh button's answer when nothing is new (owner, Oct 15 2026; canvas "pop + open", option 1): a small indigo pill at

  .wmrow { position: relative; height: 30px; display: flex; align-items: center; justify-content: center; }

  /* the menu and the refresh button share one pill, made like the language pill: a dark translucent pill, white

  .cpill { position: absolute; left: 0; top: 0; z-index: 1; display: flex; align-items: center; height: 30px; padding: 2px;
           background: rgba(18,12,30,0.34); border: 1px solid rgba(255,255,255,0.22); border-radius: 999px;

  /* as the language pill's two segments: the menu is the white one (like the selected EN), refresh the plain one */
  .cpill button { position: relative; flex: none; min-width: 34px; height: 24px; padding: 0 9px; border: 0; border-radius: 999px; background: transparent; color: #fff;
                  display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12.5px; font-weight: 700;
                  transition: background-color 200ms ease, color 200ms ease; }

  .gspace { height: 40px; }  /* 14 + 30 (wordmark row) + 40 + 14 = 98: the greeting row (top 54, 30 high) ends 14px above the bottom edge, as the wordmark row starts 14px below the top */
  header.top .greeting { position: absolute; left: 16px; right: 120px; top: 54px; line-height: 30px; height: 30px; white-space: nowrap;
                         overflow: hidden; text-overflow: ellipsis; transition: opacity 200ms ease; }

  /* the menu pill (left) and the language pill (right) are one shape (owner, Oct 11 2026): same height, border, padding and

  .cpill, .hpill { height: 30px; padding: 2px; border: 1px solid rgba(255,255,255,0.22); border-radius: 999px; background: rgba(18,12,30,0.34);
                   font-size: 12.5px; font-weight: 600; align-items: center; }
  .cpill button, .hpill button { flex: none; width: 36px; min-width: 36px; height: 24px; padding: 0; border-radius: 999px; font-size: 12.5px; font-weight: 600;

  /* the article: the colour bar travels from the card to under the headline, then its names, then audio and video */
  .abar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; gap: 2px; margin: 16px 4px 0; transform-origin: left center; }

  #sheet:not(.open) .abar { opacity: 0; }

  /* ---------- the grading made obvious (owner, Oct 15 2026; canvas "Nishpaksh USP Redesign") ----------
     1. every sentence carries a light wash of its own colour (the text colour is unchanged, so reading is not hindered;
        --tint is the strength, one place to tune it); the audio's lit sentence (.sent.lit .s, above) still wins
     2. under the headline the bar gets its names as tappable chips with counts (a symbol in each, so the grade never
        rests on colour alone); a tap lights up just those sentences
     3. once that block scrolls away the bar and chips stay pinned under the article's top
     4. a first-time reader meets "How to read the colours", which then folds into an (i) that opens the full key */
  :root { --tint: 9%; }

  /* "Latest in this story" (owner, Oct 25 2026, design "2e"): a thread rail between the colour key and the headline card.
     A node and a line run from the newest follow-up down to this article's card; no box, the card is not split. */
  .latestin { position: relative; display: block; margin: 12px 0 0; padding: 0 8px 0 36px; text-decoration: none; color: var(--ink); }

                 font: 600 18px/1.27 var(--head); letter-spacing: -.003em; }

  #sheet:not(.open) .latestin { opacity: 0; }
  #sheet.anim.open .latestin { transition: opacity 260ms ease 200ms; }
  .updates .uwas { display: block; font-size: 0.85em; color: #8a8d91; margin-top: 2px; }
  .essay .s, .card .text .s { background: color-mix(in srgb, var(--sc) var(--tint), transparent); padding: 1px 3px; border-radius: 4px;
                              -webkit-box-decoration-break: clone; box-decoration-break: clone;
                              transition: color 200ms ease, background-color 200ms ease, box-shadow 200ms ease; }
  .card .text .s { --tint: 14%; }
  #sheet[data-spot] .essay .s { color: #a8abaf; background: transparent; text-decoration: none; }
  #sheet[data-spot] .essay .s.spot-on { color: var(--st); background: color-mix(in srgb, var(--sc) 24%, transparent); box-shadow: 0 0 0 2px var(--sc); }
  #sheet[data-spot] .essay .s.spot-on.developing { text-decoration: underline dotted #7fc4bb; text-underline-offset: 4px; }
  /* continuous colour wash (owner, Oct 15 2026): the sentence colours run on without white lines between them.
     1. the wash grows up and down (padding-block) to fill the whole line height, so lines of text touch
     2. the wash is the colour mixed into white (opaque), so where lines or sentences overlap nothing doubles up
     3. a soft shadow of the same colour feathers every edge; where two colours meet they blend into each other
     tune: --feather is the softness, --lift is how far the wash reaches above and below the text */
  .essay .s, .card .text .s { --lift: 0.26em; --feather: 9px;
                              --wash: color-mix(in srgb, var(--sc) var(--tint), #fff);
                              background: var(--wash); border-radius: 0; padding: var(--lift) 4px;
                              box-shadow: 0 0 var(--feather) 1px var(--wash); }

  .essay .s::after, .card .text .s::after { content: " "; }
  .sent.lit .s { box-shadow: 0 0 5px 1px color-mix(in srgb, currentColor 14%, transparent); }
  #sheet[data-spot] .essay .s { box-shadow: none; }
  #sheet[data-spot] .essay .s.spot-on { border-radius: 4px; }
  .abar span, .pbar span { transition: opacity 200ms ease; }
  .abar span.dim, .pbar span.dim { opacity: 0.28; }
  .rise > .key.grade { display: block; margin: 12px 4px 0; font-size: 13px; }
  .gtop { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
  .gsum { font-size: 14px; font-weight: 600; color: var(--est); line-height: 1.3; }
  .gsum.none { color: var(--muted); }
  .ginfo { flex: none; min-width: 44px; min-height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: flex-end; }
  .gpill { display: flex; align-items: center; height: 32px; border-radius: 999px; background: #fff; color: #2f3a72; box-shadow: 0 2px 0 var(--edge); overflow: hidden;
           transition: background-color 500ms var(--ease), color 500ms var(--ease), padding 500ms var(--ease), box-shadow 500ms ease; }
  .gpill b { flex: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
             font-family: var(--head); font-style: italic; font-weight: 600; font-size: 18px; transition: width 500ms var(--ease), height 500ms var(--ease), margin 500ms var(--ease), background-color 500ms ease; }

  .gpill.open { background: #2f3a72; color: #fff; padding-inline-end: 14px; box-shadow: none; }

  .gchip { --c: var(--bar-e); --t: var(--est); display: flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 6px; border: 0; border-radius: 12px; cursor: pointer;
           font: inherit; font-size: 11px; font-weight: 600; line-height: 1.15; text-align: start; background: color-mix(in srgb, var(--c) 14%, #fff); color: var(--t);
           transition: background-color 200ms ease, color 200ms ease, transform 160ms ease; }
  .gchip:active, .pchip:active { transform: scale(0.97); }
  .gg { flex: none; width: 16px; height: 16px; border-radius: 50%; background: var(--c); color: #fff; font-style: normal; font-size: 10.5px; font-weight: 700;
        display: flex; align-items: center; justify-content: center; line-height: 1; }
  .gchip .gl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gchip b { flex: none; font-weight: 700; font-size: 12px; }
  .gchip.on, .pchip.on { background: var(--c); color: #fff; }
  .gchip.on .gg, .pchip.on .gg { background: #fff; color: var(--c); }
  .gdef { font-size: 13.5px; line-height: 1.45; color: var(--ink-soft); overflow: hidden; max-height: 0; opacity: 0;
          transition: max-height 260ms var(--ease), opacity 200ms ease, margin 260ms var(--ease); }
  .gdef.on { max-height: 130px; opacity: 1; margin-top: 10px; }
  .pin { position: absolute; left: 0; right: 0; top: 100%; padding: 8px max(14px, env(safe-area-inset-right)) 8px max(14px, env(safe-area-inset-left));
         border-radius: 0 0 24px 24px; background: rgb(236,236,233); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
         box-shadow: 0 12px 26px rgba(22,26,56,0.14);
         opacity: 0; transform: translateY(-10px); visibility: hidden; pointer-events: none;

           justify-content: center; gap: 4px; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; background: color-mix(in srgb, var(--c) 14%, #fff); color: var(--t);
           transition: background-color 200ms ease, color 200ms ease, transform 160ms ease; }
  .pchip .gg { font-size: 9.5px; }
  .pinfo { flex: none; width: 40px; height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .pinfo b { width: 28px; height: 28px; border-radius: 50%; background: #fff; box-shadow: 0 2px 0 var(--edge); color: #2f3a72; font-family: var(--head); font-style: italic;
             font-weight: 600; font-size: 17px; display: flex; align-items: center; justify-content: center; }
  .pin .gdef.on { margin: 4px 2px; font-size: 12.5px; }
  /* the key card (owner, Oct 15 2026, canvas "A2+ bar + pills", option 1): under the headline the colour bar, its title and its
     legend are one white card: "Backed by independent outlets" + (i), one unbroken bar, then a tinted pill per colour (symbol,
     name, count; tap to light just those sentences). The pinned copy is the same thing made smaller: solid white, hard edge. */
  .kcard { position: relative; margin: 12px 0 0; padding: 4px 12px 12px; }
  .kcard::before { content: ""; position: absolute; inset: 0; background: var(--card); border-radius: 20px; box-shadow: 0 3px 0 var(--edge); }

  .ktitle { font-family: "Nunito", var(--body); font-size: 15.5px; font-weight: 800; color: var(--ink); line-height: 1.3; }
  .kinfo { flex: none; width: 44px; height: 44px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .kinfo b, .pinfo b { width: 32px; height: 32px; border-radius: 50%; background: var(--ground); box-shadow: none; color: #2f3a72; font-family: var(--head); font-style: italic;
                       font-weight: 600; font-size: 18px; display: flex; align-items: center; justify-content: center; }
  .pinfo b { width: 28px; height: 28px; font-size: 17px; }
  .kcard .abar { margin: 0 4px; height: 12px; gap: 3px; }
  .kcard .gsum { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .kchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .kpill { --c: var(--bar-e); --t: var(--est); display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 13px 0 8px; border: 0; border-radius: 99px; cursor: pointer;
           font: inherit; font-size: 13px; font-weight: 600; background: color-mix(in srgb, var(--c) 14%, #fff); color: var(--t);
           transition: background-color 200ms ease, color 200ms ease, transform 160ms ease; }
  .kpill .gg { width: 18px; height: 18px; font-size: 12px; }
  .kpill:active { transform: scale(0.97); }
  .kpill.on { background: var(--c); color: #fff; }
  .kpill.on .gg { background: #fff; color: var(--c); }
  #sheet:not(.open) .kcard::before, #sheet:not(.open) .khead, #sheet:not(.open) .kbody { opacity: 0; }
  #sheet.anim.open .kcard::before, #sheet.anim.open .khead, #sheet.anim.open .kbody { transition: opacity 280ms ease 480ms; }
  #sheet.anim:not(.open) .kcard::before, #sheet.anim:not(.open) .khead, #sheet.anim:not(.open) .kbody { transition: opacity 110ms ease; }
  .pin { background: #F4F4F1; -webkit-backdrop-filter: none; backdrop-filter: none; border-radius: 0 0 20px 20px; padding-top: 10px; padding-bottom: 8px;
         box-shadow: 0 3px 0 var(--edge), 0 12px 24px rgba(22,26,56,0.10); }
  .pbar { height: 8px; gap: 3px; margin-bottom: 6px; }
  .pchip { min-height: 40px; border-radius: 99px; background: color-mix(in srgb, var(--c) 16%, #fff); }
  .pchip.on { background: var(--c); }
  .pchip .gg { width: 16px; height: 16px; font-size: 10.5px; }
  /* the pinned colour bar and legends (owner, Oct 15 2026: slower and smoother): the pane unrolls from the top edge like
     a window blind rather than popping in; the bar and the chips follow it one after the other; going away is quicker
     than arriving but also eased. --pin-in / --pin-out are the two durations. */
  .pin { --pin-in: 720ms; --pin-out: 420ms; --pin-ease: cubic-bezier(.22,.9,.24,1);
         transform-origin: 50% 0; transform: translateY(-26px) scaleY(.94);
         clip-path: inset(0 0 100% 0 round 0 0 20px 20px); -webkit-clip-path: inset(0 0 100% 0 round 0 0 20px 20px);
         transition: opacity var(--pin-out) ease, transform var(--pin-out) var(--pin-ease),
                     clip-path var(--pin-out) var(--pin-ease), -webkit-clip-path var(--pin-out) var(--pin-ease),
                     visibility 0s linear var(--pin-out); }
  .pin.on { transform: none; clip-path: inset(0 0 -40px 0 round 0 0 20px 20px); -webkit-clip-path: inset(0 0 -40px 0 round 0 0 20px 20px);
            transition: opacity 560ms ease, transform var(--pin-in) var(--pin-ease),
                        clip-path var(--pin-in) var(--pin-ease), -webkit-clip-path var(--pin-in) var(--pin-ease); }
  .pin > .pbar, .pin > .prow { opacity: 0; transform: translateY(-8px); transition: opacity 200ms ease, transform 200ms ease; }
  .pin.on > .pbar, .pin.on > .prow { opacity: 1; transform: none; transition: opacity 480ms ease, transform 620ms var(--pin-ease); }
  .pin.on > .pbar { transition-delay: 140ms; }

  /* Understand by talking (owner, Oct 11 2026): the live voice guide. One light blue (the colour bar's "partly backed", #4a86d6)

  :root { --talk: #4a86d6; --talk-soft: #eaf2fd; --talk-edge: #c6d8f1; }

  .talkpeek { position: absolute; top: 0; right: 0; left: 126px; height: 52px; z-index: 1; cursor: pointer; visibility: hidden;
              filter: drop-shadow(0 3px 0 var(--talk-edge)); transition: visibility 0s linear 560ms; }

                    clip-path: inset(0 0 0 calc(100% - 52px) round 26px); -webkit-clip-path: inset(0 0 0 calc(100% - 52px) round 26px);

  .acts.peek .talkpeek { visibility: visible; transition: none; }
  .acts.peek .talkpeek .tpin { clip-path: inset(0 0 0 0 round 26px); -webkit-clip-path: inset(0 0 0 0 round 26px); }
  .acts.peek .talkpeek .tpin span { opacity: 1; transform: none; transition: opacity 240ms ease 240ms, transform 360ms var(--ease) 240ms; }

  .tkcard[data-think] { animation: tkglow 1.5s ease-in-out infinite; }       /* thinking is shown ON TOP of listening (the microphone stays open) */
  @keyframes tkglow { 50% { box-shadow: 0 0 0 1.5px rgba(74,134,214,0.8), 0 0 64px rgba(74,134,214,0.5), 0 20px 56px rgba(22,26,56,0.3); } }

  .tkhead { display: grid; grid-template-columns: 36px 1fr 36px; align-items: center; gap: 8px; }

  /* the voice: eleven bars. Speaking: they dance. Listening: they follow the reader's own voice (--lv, from the microphone). */
  .tkstage { position: relative; height: 108px; margin: 10px 0 4px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .tkstage::before { content: ""; position: absolute; inset: 0 8px; border-radius: 50%; opacity: 0; transition: opacity 500ms ease;

  .tkstage i { position: relative; width: 6px; height: 92px; border-radius: 3px; transform: scaleY(0.14); opacity: 0.5;

     they stay on a little higher floor) and a shimmer runs through the bars and three dots pulse by the word: "I heard you, the answer is coming" */
  .tkcard[data-ph][data-think] .tkstage i { transform: scaleY(calc(0.3 + var(--lv, 0) * var(--k, 1) * 0.7)); animation: tkshimmer 1.2s ease-in-out infinite; animation-delay: calc(var(--i) * -0.1s); }

  @keyframes tkdot { 0%, 80%, 100% { opacity: 0.25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
  .tkcard[data-ph="speaking"] .tkstage i { opacity: 1; animation: tkdance var(--p, 0.9s) ease-in-out infinite; animation-delay: var(--d, 0s); }
  .tkcard[data-ph="listening"] .tkstage i { opacity: 1; transform: scaleY(calc(0.14 + var(--lv, 0) * var(--k, 1) * 0.86)); }

  .tkcap { margin: 0 6px; font-size: 14px; line-height: 1.5; color: var(--ink-soft); height: calc(4.5em + .6em); padding-bottom: .6em; overflow: hidden; position: relative;

  .tkcap .tkunit.is-prev { opacity: .34; transform: scale(.96); }

  .tkcard .tkgo { width: 100%; }
  .tkcard[data-ph="ready"] .tkcap, .tkcard[data-ph="ended"] .tkcap, .tkcard[data-ph="connecting"] .tkcap, .tkcard[data-think] .tkcap { display: none; }          /* the guide's last words belong to the last answer */
  .tkcard[data-ph="speaking"] .tkgo, .tkcard[data-ph="listening"] .tkgo, .tkcard[data-ph="connecting"] .tkgo, .tkcard[data-ph="thinking"] .tkgo { display: none; }

  /* the floating button: translucent, at the bottom right while the card is minimised. Over the article's own button it takes
     that button's look (white, same shadow), so the swap cannot be seen. While the guide speaks it shows a voice. */
  .tkfloat { position: fixed; left: 0; top: 0; z-index: 44; width: 52px; height: 52px; padding: 0; border-radius: 50%; cursor: pointer; color: #2f3a72;
             display: flex; align-items: center; justify-content: center; will-change: transform; scale: 0.6;
             border: 1px solid rgba(74,134,214,0.45); background: rgba(255,255,255,0.7);
             -webkit-backdrop-filter: blur(12px) saturate(1.3); backdrop-filter: blur(12px) saturate(1.3);
             box-shadow: 0 0 0 4px rgba(74,134,214,0.16), 0 0 24px rgba(74,134,214,0.38), 0 8px 22px rgba(47,58,114,0.22);

  /* ======================= design pass (owner, Oct 15 2026; prototype "Nishpaksh_Prototype") =======================
     One system for every screen:
     - shape: every control 30px and fully round (r 15); chrome edges (header, the article's header and its pane, the
       sections bar) the same 15px corner as the pills; every card 20px; gaps 12px
     - colour: one indigo for all chrome, #1f2550 at the screen edge (the status bar, theme-color) falling to #2b3570
       over the home header's full height (98px), flat after that, so the home header, the tidied header and the article's
       header (pinned or not) are the same colours at the same heights
     - the header is joined to the top edge (no floating card) and keeps the wordmark in one place on every screen
     - the article's header IS the home page's header: back | wordmark | language; once the key card has scrolled up
       under it, it grows to hold the frozen pane (section names, the bar, the pills, the definition and a ‹ › stepper)
     - every sentence in every section (tiles and quotes too) carries its colour wash
     - a colour rail at the right edge: one mark per sentence, the lines on screen lit; hold for every section's name
     - the headline box stays white like the card; the reading line is replaced by the rail */
  :root { --chrome-grad: linear-gradient(180deg, #1f2550 0px, #2b3570 calc(98px + env(safe-area-inset-top, 0px)), #2b3570 100%); }

  /* the home header: from the top edge, full width, soft 22px bottom corners */
  #app { padding-top: 0; }
  header.top { margin: 0 calc(-1 * var(--padr)) 0 calc(-1 * var(--padl));
               padding: calc(env(safe-area-inset-top, 0px) + 14px) calc(var(--padr) + 2px) 14px calc(var(--padl) + 2px); }
  header.top .greeting { left: calc(var(--padl) + 2px); top: calc(env(safe-area-inset-top, 0px) + 54px); }
  .hpill { right: calc(var(--padr) + 2px); top: calc(env(safe-area-inset-top, 0px) + 54px); }
  header.top .hbg { border-radius: 0; overflow: visible; }
  .hbw { border-radius: 0 0 15px 15px; box-shadow: 0 10px 24px -6px rgba(22,26,56,0.35), 0 2px 0 rgba(22,26,56,0.08); }
  #hbgr { height: calc(98px + env(safe-area-inset-top, 0px)); background: var(--chrome-grad); background-size: 100% 100%; }
  @media (min-width: 700px) { #app { padding-top: 0; } }
  /* the sections bar: the header's mirror */
  nav.sections { background: linear-gradient(0deg, #1f2550 0%, #2b3570 100%); border-radius: 15px 15px 0 0; box-shadow: 0 -8px 22px -6px rgba(22,26,56,0.30); }
  .sb .face { border-radius: 999px; }
  /* cards and boxes: one 20px corner */
  .card, .state { border-radius: 20px; }
  .tile { border-radius: 20px; }
  .hbox, .hbox .layer { border-radius: 20px; }
  .hbox .hpic { border-radius: 20px 20px 0 0; }

  /* the article's header: the same indigo, the same row, the same place, the same height as the home header */
  .chrome { opacity: 1; background: var(--chrome-grad); color: #fff; border-radius: 0 0 15px 15px; z-index: 3;
            box-shadow: 0 10px 24px -6px rgba(22,26,56,0.35), 0 2px 0 rgba(22,26,56,0.08);
            padding: calc(env(safe-area-inset-top, 0px) + 14px) calc(max(14px, env(safe-area-inset-right)) + 2px) 14px calc(max(14px, env(safe-area-inset-left)) + 2px);
            transition: box-shadow 300ms ease, border-radius 0s linear 0s; }
  .chrome.stuck { background: var(--chrome-grad); -webkit-backdrop-filter: none; backdrop-filter: none; }
  #sheet .chrome, #sheet.anim .chrome, #sheet.open .chrome, #sheet.anim:not(.open) .chrome { opacity: 1; }
  @media (min-width: 700px) { .chrome { padding-top: calc(env(safe-area-inset-top, 0px) + 14px); } }
  .crow { position: relative; z-index: 2; height: 30px; margin-bottom: 0; }
  .chrome .wm-ink { background: none; -webkit-background-clip: border-box; background-clip: border-box; color: #fff; -webkit-text-fill-color: #fff;
                    text-shadow: 0 1px 2px rgba(0,0,0,0.35), 0 0 18px rgba(0,0,0,0.18); line-height: 30px; }
  .chrome .pill.light { background: rgba(18,12,30,0.34); border: 1px solid rgba(255,255,255,0.22); box-shadow: none; padding: 2px; height: 30px;
                        -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .chrome .pill.light button { width: 36px; min-width: 36px; height: 24px; padding: 0; border-radius: 999px; color: #fff; }
  .chrome .pill.light button[aria-pressed="true"] { background: #fff; color: #1f2550; }
  /* the menu pill becomes the back button (owner, Oct 15 2026: "same size; the right side of the pill comes towards the left
     and turns into the back button"). The back button is built like the pill's left end: the same 30px translucent rim
     (1px edge, 2px inside) holding a white 24px centre. While the article grows out of the card, the pill's right side
     slides left (clip-path, no relayout) until only that 30px end is left; the white menu segment's right side slides left
     with it (36px wide -> a 24px circle); the menu icon / initial fades and the arrow fades in on the same centre. The
     article's own back button (#back) is the same shape in the same place, so the hand-over cannot be seen. */
  header.top .cback, .cfold .cback { position: absolute; left: 0; top: 0; z-index: 2; width: 30px; height: 30px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.22);
                      padding: 0; background: none; color: #1f2550; display: flex; align-items: center; justify-content: center;
                      pointer-events: none; opacity: 0; transition: opacity 160ms ease; }
  header.top .cpill, .cfold .cpill { transition: clip-path 380ms cubic-bezier(.3,.1,.2,1), -webkit-clip-path 380ms cubic-bezier(.3,.1,.2,1); clip-path: inset(-8px 0 0 0 round 15px); -webkit-clip-path: inset(-8px 0 0 0 round 15px); }
  /* the unread badge sticks out of the menu button (top -4px, right -5px): the clips leave room for it at rest */
  header.top .cpill .mbtn, .cfold .cpill .mbtn { transition: clip-path 380ms cubic-bezier(.3,.1,.2,1), -webkit-clip-path 380ms cubic-bezier(.3,.1,.2,1), color 140ms ease;
                            clip-path: inset(-8px -8px -8px -8px round 12px); -webkit-clip-path: inset(-8px -8px -8px -8px round 12px); }
  .mbadge { transition: opacity 160ms ease; }

  /* ---------- the section cards' wash (owner, Oct 15 2026; design "C · even spread", spread 15, softness 14, strength 14%) ----------

  /* the glass (owner, Oct 28 2026; chosen on the "Greeting Motion" page: greeting option 2, sections option B). The header

     card's picture, top left, beside the photo credit: the greeting once (fades in 0.8 s, holds 2 s, fades out 0.8 s,

/* audio: one new request a day per reader; audio already made is free (owner) */
const istDayStart = () => { const ist = new Date(Date.now() + 5.5 * 3600e3); ist.setUTCHours(0, 0, 0, 0); return new Date(ist.getTime() - 5.5 * 3600e3).toISOString(); };
/* the audio and video cards open complete (owner, Oct 10 2026: they opened, then the options or videos jumped in):
   their data is fetched when the article opens, and a tap waits for it before the card slides up */
const pre = {id: null, audio: null, videos: null};
function audioData(id) {
  return Promise.all([
    api(`audio_files?select=lang&key=in.(${id}-en,${id}-hi)`),
    rest(`audio_requests?select=id&requested_at=gte.${encodeURIComponent(istDayStart())}`),
    rest(`audio_requests?select=lang&story_id=eq.${encodeURIComponent(id)}&status=eq.queued`)])
    .then(([files, mineToday, mineHere]) => ({id, loaded: true, ready: files.map(f => f.lang), left: Math.max(0, 1 - mineToday.length), mine: mineHere.map(r => r.lang)}))
    .catch(e => e.message === "login" ? {id, login: true} : {id, loaded: true, ready: [], left: 1, mine: []});
}
const vlang = v => v.lang === "hi" || v.lang === "en" ? v.lang : /[\u0900-\u097f]/.test(v.title || "") || HINGLISH.test(v.title || "") ? "hi" : "en";
const HINGLISH = /\b(kya|hai|hain|mein|kaise|kyun|kyon|nahi|nahin|aur|ki|ka|ke|ko|se|tha|thi|hua|hui|kab|kaun|bada|badi)\b.*\b(kya|hai|hain|mein|kaise|kyun|kyon|nahi|nahin|aur|ki|ka|ke|ko|se|tha|thi|hua|hui|kab|kaun|bada|badi)\b/i;
function videoData(id) {
  return api(`videos?select=items&story_id=eq.${encodeURIComponent(id)}`).then(rows => {
    const items = ((rows[0] && rows[0].items) || []).map(v => ({...v, lang: vlang(v)}));
    const hi = items.filter(v => v.lang === "hi"), en = items.filter(v => v.lang !== "hi"), out = [];
    for (let k = 0; k < Math.max(hi.length, en.length); k++) { if (hi[k]) out.push(hi[k]); if (en[k]) out.push(en[k]); }
    return out;
  }).catch(() => []);
}
function prefetch(id) {
  pre.id = id; pre.videos = videoData(id); pre.audio = me ? audioData(id) : null;
}
async function waitFor(btn, p) {
  if (btn) btn.classList.add("waiting");
  try { return await p; } finally { if (btn) btn.classList.remove("waiting"); }
}
async function openAudio(btn) {
  const id = openId;
  if (!id) return;
  if (!me) { afterSignin = () => { prefetch(id); openAudio(); }; authMode = "signup"; openSheet("signin"); return; }
  if (pre.id !== id || !pre.audio) { pre.id = id; pre.audio = audioData(id); }
  const st = await waitFor(btn, pre.audio);
  pre.audio = null;                      // asked again next time: a request may have been made since
  if (openId !== id) return;
  if (st.login) { afterSignin = openAudio; openSheet("signin"); return; }
  audioState = st; chosenLang = null; openSheet("audio");
}
async function makeAudio() {
  const id = audioState.id, l = chosenLang || lang, perm = askPermission();   // asked inside the tap (Safari needs that)
  busy = true; renderSheet();
  try {
    const r = await rest("rpc/request_audio", {method: "POST", body: JSON.stringify({p_story: Number(id), p_lang: l})});
    busy = false;
    if (r.status === "ready") { audioState.ready.push(l); renderSheet(); return; }
    if (r.status === "gone") audioState.gone = true;
    else if (r.status === "limit") audioState.left = 0;
    else { audioState.mine.push(l); audioState.left = Math.max(0, audioState.left - 1); subscribePush(perm); }
    renderSheet();
  } catch (e) { busy = false; sheetErr = T[lang].errs.net; renderSheet(); }
}
function askPermission() {
  if (!("Notification" in window)) return Promise.resolve("unsupported");
  if (Notification.permission !== "default") return Promise.resolve(Notification.permission);
  try { return Notification.requestPermission(); } catch (e) { return Promise.resolve("default"); }
}
async function subscribePush(permP) {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return;
  if ((await permP) !== "granted") return;
  try {
    const raw = b64url(VAPID);
    const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) ||
      await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: Uint8Array.from(raw, c => c.charCodeAt(0))});
    const j = sub.toJSON(), uid = myId();
    await rest("push_subscriptions?on_conflict=endpoint", {method: "POST", headers: {Prefer: "resolution=merge-duplicates"},
      body: JSON.stringify({endpoint: j.endpoint, reader: uid, p256dh: j.keys.p256dh, auth: j.keys.auth, lang})});
  } catch (e) { /* the notification still waits in the database */ }
}

/* the player: each sentence lit in its own colour while it is read (owner: highlighting only) */
const player = {el: null, key: null, units: [], on: null};
const pbar = document.createElement("div");
pbar.className = "player brand";
pbar.innerHTML = `<button type="button" id="p-pp">${ICON.pause}</button><input type="range" id="p-seek" min="0" max="1000" value="0"><span class="tl" id="p-tl">0:00</span><button type="button" id="p-x">${ICON.x.replace('#3d4043', 'currentColor')}</button>`;
document.body.append(pbar);
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
async function playAudio(key) {
  if (TK.ui !== "closed") tkLeave();      // the read-aloud and the guide would talk over each other
  if (!player.el) {
    player.el = new Audio(); player.el.preload = "auto";
    player.el.addEventListener("timeupdate", () => light(false));
    player.el.addEventListener("play", () => { $("p-pp").innerHTML = ICON.pause; $("p-pp").setAttribute("aria-label", T[lang].pause); });
    player.el.addEventListener("pause", () => { $("p-pp").innerHTML = ICON.play; $("p-pp").setAttribute("aria-label", T[lang].play); });
    player.el.addEventListener("ended", unlight);
  }
  player.key = key; player.units = [];
  try { player.units = (await getJSON(`audio/${key}.json`)).units || []; } catch (e) { /* plays without the lighting */ }
  player.el.src = `audio/${key}.m4a`;
  $("p-seek").setAttribute("aria-label", T[lang].seek); $("p-x").setAttribute("aria-label", T[lang].close);
  pbar.classList.add("on");
  player.el.play().catch(() => {});
}
$("p-pp").addEventListener("click", () => { const a = player.el; if (a) a.paused ? a.play() : a.pause(); });
$("p-x").addEventListener("click", () => { if (player.el) player.el.pause(); pbar.classList.remove("on"); unlight(); player.key = null; });
$("p-seek").addEventListener("input", e => { const a = player.el; if (a && a.duration) a.currentTime = a.duration * e.target.value / 1000; });
function unlight() { document.querySelectorAll(".sent.lit").forEach(x => x.classList.remove("lit")); player.on = null; }
function light(force) {
  const a = player.el;
  if (!a || !player.key) return;
  if (a.duration) { $("p-seek").value = String(Math.round(1000 * a.currentTime / a.duration)); $("p-tl").textContent = `${fmt(a.currentTime)} / ${fmt(a.duration)}`; }
  const us = player.units;
  if (!us.length) return;
  let lo = 0, hi = us.length - 1, k = 0;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (us[m].t <= a.currentTime) { k = m; lo = m + 1; } else hi = m - 1; }
  const u = us[k], tag = `${u.p}.${u.s}`;
  if (tag === player.on && !force) return;
  unlight(); player.on = tag;
  const [sid, l] = player.key.split("-");
  if (openId !== sid || lang !== l || u.s < 0) return;
  const el = $("rise").querySelector(`.sent[data-k="${tag}"]`);
  if (el) { el.classList.add("lit"); if (!a.paused) el.scrollIntoView({block: "center", behavior: STILL.matches ? "auto" : "smooth"}); }
}

let follows = new Map(), followKeys = new Map(), unread = 0, followSub = null, followBusy = false;   // followKeys: shown key -> stored key

      const key = r.kind === "section" ? followPath(r.key) : r.key;

async function setFollow(kind, key, on, label) {

  if (on) {

    await rest("follows", {method: "POST", headers: {Prefer: "resolution=ignore-duplicates"}, body: JSON.stringify({reader: myId(), kind, key, label: label || key})});
  } else {
    follows.delete(k);
    const stored = followKeys.get(k) || key;                // the key as stored (an earlier tree's path)
    followKeys.delete(k);
    await rest(`follows?kind=eq.${encodeURIComponent(kind)}&key=eq.${encodeURIComponent(stored)}`, {method: "DELETE"});
  }
}

async function followClick(b) {
  if (followBusy) return;
  const S = SECTIONS.en;
  followBusy = true;
  try {
    if (b.dataset.fsub) { followSub = b.dataset.fsub; renderSheet(); return; }
    if (b.dataset.fall) {                                   // the circle: all of the section, or nothing
      const p = b.dataset.fall, on = !isF("section", p);
      const jobs = [setFollow("section", p, on, S.primary[p])];
      for (const s of S.tree[p] || []) jobs.push(setFollow("section", `${p}/${s}`, false));
      renderSheet(); await Promise.all(jobs);
    } else if (b.dataset.fone) {
      const [kind, key, label] = b.dataset.fone.split("|");
      if (kind === "section") {                             // one sub-section; all of them = the whole section
        const p = key.split("/")[0], subs = S.tree[p] || [];
        let chosen = isF("section", p) ? subs.slice() : subs.filter(s => isF("section", `${p}/${s}`));
        const s = key.split("/")[1];
        chosen = chosen.includes(s) ? chosen.filter(x => x !== s) : [...chosen, s];
        const whole = chosen.length === subs.length;
        const jobs = [setFollow("section", p, whole, S.primary[p])];
        for (const x of subs) jobs.push(setFollow("section", `${p}/${x}`, !whole && chosen.includes(x), S.secondary[x]));
        renderSheet(); await Promise.all(jobs);
      } else { const job = setFollow(kind, key, !isF(kind, key), label); renderSheet(); await job; }
    } else if (b.dataset.fword) { const w = b.dataset.fword; const job = setFollow("entity", w.toLowerCase(), false); renderSheet(); await job; }
    askPermission().then(p => subscribePush(Promise.resolve(p)));
  } catch (e) { toast(T[lang].error); await loadFollows(); renderSheet(); }
  finally { followBusy = false; }
}

async function loadNotes() {
  notesData = null; noteAsk = false;
  try {
    const [notes, reqs] = await Promise.all([
      rest("notifications?select=id,kind,title,body,url,created_at,read_at&cleared_at=is.null&order=created_at.desc&limit=50"),
      rest("audio_requests?select=story_id,lang,status,requested_at,done_at&cleared_at=is.null&order=requested_at.desc&limit=20")]);
    // an audio is removed 36 h after it is made: a finished request whose file is gone is not listed, the rest say when they go
    const files = await api("audio_files?select=key,made_at").catch(() => null);

      const made = new Map(files.map(f => [f.key, f.made_at]));
      for (let i = reqs.length - 1; i >= 0; i--) {
        const r = reqs[i], k = `${r.story_id}-${r.lang}`;
        if (r.status !== "done") continue;
        if (!made.has(k)) reqs.splice(i, 1);

    }
    const heads = {};
    await Promise.all([...new Set(reqs.map(r => String(r.story_id)))].map(async id => {
      const c = (pool || []).find(x => String(x.id) === id);
      if (c) { heads[id] = c.h; return; }
      const row = await loadStory(id).catch(() => null);
      heads[id] = row ? ((lang === "hi" && row.headline_hi) || row.headline_en) : "";
    }));
    notesData = {notes, reqs: reqs.map(r => ({...r, h: heads[String(r.story_id)] || ""}))};
  } catch (e) { notesData = {notes: [], reqs: []}; }
  if (sheetKind === "notes") renderSheet();

/* the sheet's own actions. A clear is soft: the row is hidden for this reader (cleared_at), never deleted */
async function clearNotes(what, arg) {
  if (!notesData) return;
  const now = new Date().toISOString(), patch = (path, body) => rest(path, {method: "PATCH", body: JSON.stringify(body)});
  try {
    if (what === "ask") { noteAsk = true; renderSheet(); return; }
    if (what === "no") { noteAsk = false; renderSheet(); return; }
    if (what === "read") {
      await patch("notifications?read_at=is.null&cleared_at=is.null", {read_at: now});
      notesData.notes.forEach(n => { n.read_at = n.read_at || now; });
    } else if (what === "all") {
      await patch("notifications?cleared_at=is.null", {read_at: now, cleared_at: now});
      notesData.notes = []; noteAsk = false;
    } else if (what === "one") {
      const id = Number(arg);
      await patch(`notifications?id=eq.${id}`, {read_at: now, cleared_at: now});
      notesData.notes = notesData.notes.filter(n => n.id !== id);
    } else if (what === "audio") {
      const [sid, l] = String(arg).split("|");
      await patch(`audio_requests?story_id=eq.${encodeURIComponent(sid)}&lang=eq.${encodeURIComponent(l)}&status=neq.queued`, {cleared_at: now});
      notesData.reqs = notesData.reqs.filter(r => !(String(r.story_id) === sid && r.lang === l));
    }
  } catch (e) { toast(T[lang].error); return; }
  unread = nUnread(); paintBadge();
  if (sheetKind === "notes") renderSheet();
}
async function markNoteRead(id) {
  const n = notesData && notesData.notes.find(x => x.id === Number(id));
  if (!n || n.read_at) return;
  n.read_at = new Date().toISOString(); unread = nUnread(); paintBadge();

/* swipe a notification left to show Clear (a long swipe clears it); one row open at a time */
(function () {
  const OPEN = 96, FAR = 190;
  let row = null, sx = 0, sy = 0, base = 0, dx = 0, mode = "";             // mode: "" until the direction is known, then "h" or "v"
  const rowOf = e => e.target.closest && e.target.closest(".nsw");
  const slide = (sw, x, anim) => { sw.classList.toggle("drag", !anim); sw.querySelector(".nrow").style.transform = `translateX(${x}px)`; sw.classList.toggle("open", x < 0); };
  const closeOthers = keep => bsheet.querySelectorAll(".nsw.open").forEach(o => { if (o !== keep) { slide(o, 0, true); delete o.dataset.x; } });
  bsheet.addEventListener("pointerdown", e => {
    if (sheetKind !== "notes" || e.target.closest(".nrm")) return;
    const sw = rowOf(e); if (!sw) return;
    closeOthers(sw);
    row = sw; sx = e.clientX; sy = e.clientY; base = Number(sw.dataset.x || 0); dx = 0; mode = "";
  });
  bsheet.addEventListener("pointermove", e => {
    if (!row) return;
    const mx = e.clientX - sx, my = e.clientY - sy;
    if (!mode) {
      if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
      mode = Math.abs(mx) > Math.abs(my) ? "h" : "v";
      if (mode === "h") { try { row.setPointerCapture(e.pointerId); } catch (err) { /* ok */ } }
    }
    if (mode !== "h") return;
    dx = Math.min(0, Math.max(-(FAR + 40), base + mx));
    slide(row, dx, false);
  });
  const end = () => {
    if (!row) return;
    const sw = row, was = mode; row = null; mode = "";
    if (was !== "h") return;
    swipeAt = Date.now();
    if (dx <= -FAR) { clearNotes("one", sw.dataset.nsw); return; }
    const open = dx < -OPEN / 2;
    sw.dataset.x = open ? -OPEN : 0; slide(sw, open ? -OPEN : 0, true);
  };
  bsheet.addEventListener("pointerup", end); bsheet.addEventListener("pointercancel", end);
})();

  if (me) await loadFollows();

    : items.map(it => `<button type="button" class="ritem" data-rstory="${esc(it.id)}"><div class="h">${esc(it.h)}</div><p>${(it.lead || []).map(sentenceHtml).join("")}</p></button>`).join("");

    ${note}${toggle}${body}</div>`;
}

// the kicker's place on the card, and its glide into (and back out of) the article, like the headline's

/* ---------- the section cards' wash (owner, Oct 15 2026; see the style block of the same name) ----------
   Each card of a numbered section gets a canvas behind its text. For every sentence, its own line boxes, grown by
   WASH.spread on every side and blurred by WASH.soft, make a soft shape; where shapes overlap, the colours mix in
   proportion to their strength, so a colour runs on under the next sentence's text with no seam. The colour is the
   sentence's own (--sc) mixed into white at WASH.tint. Painting waits until the opening animation is over, then goes

   ~95% of the main thread's time while opening, closing and refreshing). Now each sentence's grown line boxes are filled
   in its own colour with the canvas's blur, straight onto the card's canvas: the GPU does it, nothing is read back, a card
   takes a few ms. Same spread, softness and strength; where two sentences overlap the later one is laid over the earlier
   with the blur's own alpha (the old loop weighted the two by strength), which reads the same at these tints. */

   out as hard-edged rectangles there (owner, Oct 28 2026). Asked once by trying: a 4px square drawn with blur(2px) has some colour
   2px outside its edge only if the blur happened. Where it did not, washCard blurs with the canvas's shadow instead. */

  washIdle(() => {
    // the first card in view (or nearest below it) first
    const view = sheetScroll.getBoundingClientRect();
    const order = [...washQueue].filter(c => c.isConnected).sort((a, b) =>
      Math.abs(a.getBoundingClientRect().top - view.top) - Math.abs(b.getBoundingClientRect().top - view.top));

/* the home cards: the same wash behind each card's text, painted for the cards on screen and next to it (the deck holds

function washDeckNow() {
  const slots = track.children, k = current + (cards.length > 1 ? 1 : 0);
  for (let i = Math.max(0, k - 1); i <= Math.min(slots.length - 1, k + 1); i++) {
    const t = slots[i] && slots[i].querySelector(".card .text.wcard");

function setupDeckWash() {

/* ---------- headlines fitted to the card (owner, Oct 15 2026; canvas "Headline alignment", option C4) ----------
   Justifying a headline stretched its spaces unevenly; left-aligned, short lines left a ragged edge. Now each headline gets
   the size, from 3px below the usual (27px, Hindi 24px) to 7px above, that puts it in the fewest lines with those lines
   closest to the full width (a lone last word costs extra). Word spacing is never stretched. Lines are fixed by code (one
   span each), measured with the page's own font on a canvas; the article's headline is fitted at the card headline's width,
   so both carry the same lines and size and the opening glide never re-wraps. */

function fitHead(el, W) {

  const plan = hfitPlan(text, cs.fontWeight, cs.fontFamily, base, Math.round(ls * 10000) / 10000, W);
  if (!plan) { el.textContent = text; return; }
