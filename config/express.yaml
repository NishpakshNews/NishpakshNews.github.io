# The express lane (owner, Oct 12 2026): stories on a short POSITIVE list of topics ("lanes") may be written from
# ONE independent outlet's readable page, instead of 3. Everything else keeps the strict rule.
#
# The lane is strict at the door and honest in the colours:
#   - a story enters a lane only if its headline names one of the lanes below (asked of a small model twice, order
#     swapped, "unsure" = not express) AND none of the concerns below fits it (read by the local entailment model, `risk.py`);
#   - express articles are purple ("one outlet only") and are NEVER green: green needs 3 independent outlets,
#     2 origins and 6 hours, so an express story cannot reach it. No colour rule was changed for it;
#   - a main fact must trace to a NAMED origin (the company, the league, an official), not "sources said".
#
# Every number below is a dial. Raise or lower it after reading ledger/LEDGER.md for a few days.
# To switch the whole lane off: `enabled: false`.

enabled: true

# Outlets with a readable page a story needs before it is read and written (owner, Oct 16 2026: a sport story read
# from two outlets was far better than the one-outlet ones). Outlets, not independent sources: two papers of one owner
# count as two; one wire copy carried by two outlets counts once. Every readable outlet is read before writing.
min_outlets: 2

# Round one. Left out on purpose: economy and markets (government figures, interference), health and general life
# (one wrong medical claim does real harm). Add a lane here only after reading the first batch it produced.
lanes:
  companies:
    label: Companies
    describe: "a company announces or reports something about itself: results, launches of a business line, deals it signs, hires, plans, openings, awards"
  sport:
    label: Sport
    describe: "the result, score, schedule, squad or record of a match, tournament or athlete"
  entertainment:
    label: Entertainment
    describe: "a film, series, song, show or artist: a release, trailer, cast, award or festival announcement"
  tech:
    label: Tech launches
    describe: "a company launches or announces a phone, gadget, app, software or service, with its price and features"

# Daily and per-run caps (the quota day is Pacific, as Google's own). Express shares the embedding quota with
# politics (3,000 texts a day over three keys), so it gets a slice, not the whole.
embed_daily_cap: 400        # embedding texts an express article may use per quota day (spread by the day's pacing curve)
filter_batch: 20            # headlines per cheap model question
filter_calls_per_run: 6     # first-asking calls per run (a headline is asked about once; undecided ones wait for the next run)
risk_seconds_per_run: 480   # the local reader may spend this long a run on express headlines (risk.py); the rest is read next run
intake_per_run: 120         # new express-feed links taken per run, apart from the 400 the main feeds share
intake_per_feed: 12         # ... and at most this many from one express feed
reads_per_run: 3            # express stories read (Flash-Lite) per run
# (the seats are `desk_beat_seat` in config.py: 2 an hour, shared by Domains, Sport and express stories; Domains and Sport rank first)

# Worked examples for the headline question (a small model: show the traps). "headline -> lane" or "-> none (why)".
filter_examples:
  - '"Tata Motors opens new EV plant in Sanand" -> companies'
  - '"Infosys appoints new head of its cloud business" -> companies'
  - '"Reliance Retail to open 500 new stores this year, company says" -> companies'
  - '"India beat Australia by six wickets in the second ODI" -> sport'
  - '"Sindhu enters semi-final of Japan Open" -> sport'
  - '"Rohit Sharma named captain for the Test series" -> sport'
  - '"Netflix announces release date of new Hindi series" -> entertainment'
  - '"Trailer of the Diwali release is out" -> entertainment'
  - '"Samsung launches Galaxy phone at Rs 49,999" -> tech'
  - '"Apple releases iOS update with new features" -> tech'
  - '"Government announces new PLI scheme for electronics makers" -> none (the government acting)'
  - '"Founder booked in fraud case" -> none (a crime case)'
  - '"Sensex ends 400 points higher on bank stocks" -> none (markets)'
  - '"Actor spotted at the airport with her new friend" -> none (gossip)'
  - '"Why Indian start-ups are struggling to hire" -> none (analysis)'
  - '"10 best phones under Rs 20,000" -> none (a list)'

# --- Concerns (the local NLI model reads each headline BEFORE any other model does) ---------------------------------
# Owner, Oct 27 2026: no word lists. A word list says what a story is about by the words it happens to use ("court" is
# a tennis word, "ED" an agency and a singer, "May" a month) and needs a person to patch it for each case. Each concern
# below is instead a DEFINITION, a plain sentence the local entailment model (nishpaksh/nli.py, English and Hindi) is
# asked about: "does this headline and its opening say that?" The headline is the premise, the sentence the hypothesis.
# A concern fires when the model's entailment probability reaches `concern_min`. A headline the model could not read
# is never passed (nishpaksh/risk.py): it is asked again on the next run. The reason kept with the article is
# `concern:definition` ("harm:crime"), which the ledger counts, so you can see which definition does the work.
# To change what is kept out, change a SENTENCE here, not a word; `python -m nishpaksh.express_replay` shows, on stored
# headlines, what each sentence catches and where it disagrees with what the first (word-list) design decided.
#
# Several sentences per concern, because one sentence joining several ideas ("a crime or an accident or a fraud")
# is read poorly by a small model; any one of them reaching the bar fires the concern.
concern_min: 0.5            # entailment probability that counts as "the headline says this" (untuned: read it in the audit)

concerns:
  # where one source is dangerous: crime, harm and accusation. Applies to every lane.
  harm:
    crime: "The news is about a crime, an arrest, a police case or a case in a court."
    death: "Someone has died, been killed or been injured in an accident, an attack or a disaster."
    accusation: "Someone is accused of fraud, cheating, abuse or another wrong."
    ban: "A person or a team has been banned, suspended or punished for breaking rules."
    unrest: "The news is about violence, a riot, terror, hate or a communal clash."
  # a government, ministry or regulator acts on or speaks about the story (the same interference problem as markets)
  government:
    acts: "A government, a ministry, a regulator or a public authority has taken a decision, issued an order or made a rule."
    policy: "The news is about a law, a government scheme, a tax, a tariff or an official policy."
  # economy and markets (government figures, share prices, tips): left out of round one by the owner
  market:
    prices: "The news is about share prices, an index, a currency, or the price of gold, oil or fuel moving."
    economy: "The news is about inflation, interest rates, growth figures, or the state of the economy."
    advice: "The news advises people what to buy, sell or invest in."
  # something said only by unnamed people, or that has not happened
  speculation:
    rumour: "The news is a rumour, a leak, or something said by unnamed people."
    forecast: "The news is a guess or a prediction about what may happen, or a talk that has not led to a decision."
  # film and celebrity gossip, and the numbers producers inflate
  gossip:
    private_life: "The news is about the private life, relationship, looks or social media post of a celebrity."
    box_office: "The news is about how much money a film has earned."
  # service pieces, live blogs and filler: nothing to check, nothing worth the seat
  service:
    list: "The article is a list, a ranking, a buying guide or a set of tips."
    live: "The article is a live blog, a live score page, or a daily rate or horoscope."
    view: "The article is an opinion, an editorial, an explainer or a sponsored post."

# Which lanes each concern applies to. A concern that is ordinary in one lane is a warning in another: a share-price
# move is the news in markets but "a rally" is a tennis term; a clash is a match in sport and a feud in film gossip.
apply:
  harm: all
  government: all
  speculation: all
  service: all
  market: [companies, tech]
  gossip: [entertainment]

# URL path pieces that mark a page that is not a news report (opinion, photos, video, web stories, sponsored)
exclude_url:
  - /opinion/
  - /opinions/
  - /editorial/
  - /columns/
  - /column/
  - /blogs/
  - /photos/
  - /photogallery/
  - /photo-gallery/
  - /videos/
  - /video/
  - /web-stories/
  - /webstories/
  - /brand-studio/
  - /sponsored/
  - /advertorial/
  - /podcast/
  - /quiz/
  - /horoscope/
  - /live-blog/
  - /live-updates/
  - /liveblog/

# Part 3: reading and qualifying
wait_for_second_hours: 0    # no settling wait (owner, Oct 16 2026): two outlets are read (min_outlets) before an express story qualifies
normal_route_outlets: 3     # a story with this many independent outlets is not express: the normal rule decides
own_voice_lanes: [sport]    # lanes where the outlet's own voice may stand for a named origin (a match result)
# Part 5 (owner, Oct 13 2026): the bar of significance and the strict order.
# After the lane, a second question: does a reader of a national app NEED this? (express.SIG_PROMPT: "india", "world" or
# "none"; asked twice, second time reversed, both must agree, unsure = none). Only "india" and "world" are embedded and read.
significance_enabled: true
significance_calls_per_run: 6
# The strict order of the beat seats, best first: express companies and tech, then the Domains desk, then Sport (the Sport
# desk and express sport are one place), then express entertainment. Express stories use the beat seats only.
order: [companies, tech, domains, sport, entertainment]
significance_lane_notes:
  companies: "pass (india) only for a large or widely known company, or a deal, investment, hiring, closure or launch that reaches many Indians; a small or little-known company, a routine appointment or a minor tie-up is none"
  tech: "pass (india or world) a launch or change by a brand many Indians use (phones, apps, platforms, chips, AI), with what it means for users; a small brand, a leak, specs or a rumour is none"
  sport: "pass India's teams and athletes' results, medals, titles, records, awards and public rows; and rulings, tournaments and records of a whole sport or a global sensation. One foreign player's or team's injury, squad, form or fixtures is none unless it is against India"
  entertainment: "the hardest bar: pass only a national-level event (a national or major international award or festival win by an Indian, an Indian film or artist at a global stage, an industry-wide ruling). Casting, sequels' cast, a signing, an appearance, a personal life matter is none"
significance_examples:
  - '"Knee and head injuries threaten availability of Ryan Coleman-Williams for upcoming games" -> none (one foreign player)'
  - '"Bhojpuri actor says she has been single for years" -> none (private life)'
  - '"Injured Pathum Nissanka makes Sri Lanka squad for Pakistan Tests" -> none (a squad of two foreign teams, not India)'
  - '"Shubman Gill wins ICC Player of the Month award for fifth time" -> india'
  - '"Mithun Chakraborty joins Jailer 2 cast after initial refusal to play villain" -> none (cast detail)'
  - '"Vidya Balan makes her Tamil film debut in Jailer 2" -> none (cast detail)'
  - '"Comedian signs new show after five years away" -> none (a minor celebrity)'
  - '"Premier League champions face title stripping as Steven Gerrard backs severe penalty" -> none (one foreign club)'
  - '"Mizoram hockey player Lalremsiami returns home after India wins Asian Games gold" -> india'
  - '"Sumit Nagal faces backlash after gesturing at spectators following match win" -> india (an Indian, a public row)'
  - '"ICC changes the over-rate rules for all Test cricket" -> world (the whole sport)'
  - '"Football icon announces retirement" -> world (a global figure)'
