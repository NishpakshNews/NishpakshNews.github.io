# Event types in the order a news story's events usually happen (Notes B15: one ontology, many users).
# Used only to order events that happen the SAME day with no clock time, where the clock cannot say which came
# first: a person is detained before he is released. Each line is one stage; words are matched as word stems.
# Add words freely: a stem in two stages stays in the first.
stages:
  - [incident, attack, blast, explosion, collaps, crash, stamped, fire, flood, earthquak, kill, die, murder, shoot, stab, abduct, kidnap, rob, loot]
  - [detain, arrest, nab, apprehend, caught, seiz, raid, search]
  - [question, interrogat, summon, probe, investigat, inquir]
  - [charg, book, fir, chargesheet, register, accus, alleg]
  - [remand, custod, produc]
  - [hear, plea, petit, argu, submit, appeal]
  - [releas, bail, freed, free, discharg, acquit]
  - [convict, sentenc, verdict, order, rule, quash, uphold, dismiss]
  - [resign, sack, suspend, transfer, appoint, condol, announc, compensat]
