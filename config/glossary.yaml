# Fidelity glossary (nishpaksh/fidelity.py). Written by hand: a wrong line here makes the check itself wrong.
#
# qualifiers: small words that change what a sentence claims. A statement read from a report, or a translation, must
#   keep each one the source has and add none it lacks. Several Hindi words may say the same thing.
#     strict: true  -> a lost or added word is a problem (the reading and translation fixes act on it)
#     strict: false -> only counted (the audit), until the numbers show it is not noisy
#     number: true  -> counted only next to a number ("about 40", "करीब 40"): "about" also means "concerning"
# entities: one body or party in both languages, in any of its usual renderings. Used ONLY to find which sentence of
#   a report a statement came from; never to choose a word.
# terms: OUR rendering of a term in Hindi translations (binding). Only terms Hindi outlets render one way.

qualifiers:
  - {id: negation, strict: true, en: ["not", "n't", "never", "no", "neither", "nor", "none", "cannot"],
     hi: [नहीं, न, ना, मत, कभी नहीं, कतई नहीं]}
  # "…" lets up to 12 words stand between: Hindi says कभी ... नहीं around the verb ("कभी कोई भूमिका नहीं रही")
  - {id: never, strict: true, en: ["never"], hi: [कभी … नहीं, कभी … न]}
  - {id: directly, strict: true, en: [directly, direct], hi: [सीधे, सीधा, सीधी, प्रत्यक्ष, प्रत्यक्ष रूप से]}
  - {id: only, strict: true, en: [only, solely, merely], hi: [केवल, सिर्फ, सिर्फ़, मात्र, महज, महज़]}
  - {id: at_least, strict: true, en: [at least, a minimum of, minimum], hi: [कम से कम, कम-से-कम, न्यूनतम]}
  - {id: up_to, strict: true, number: true, en: [up to, at most, at the most, a maximum of, maximum],
     hi: [अधिकतम, ज्यादा से ज्यादा, ज़्यादा से ज़्यादा, तक_ऊपरी]}   # तक_ऊपरी: "100% तक" (fidelity._prepare)
  - {id: more_than, strict: true, number: true, en: [more than, over, above, upwards of, in excess of, exceeding,
     exceeds, exceeded, beyond],
     hi: [से अधिक, से ज्यादा, से ज़्यादा, से ऊपर, अधिक]}
  # "alleged" only as an adjective ("the alleged bribe"): "X alleged that" is a verb (आरोप लगाया), not a qualifier
  - {id: alleged, strict: true, en: [allegedly, purported, purportedly, the alleged, an alleged, his alleged,
     her alleged, their alleged, its alleged, of alleged, over alleged, for alleged, in alleged, on alleged,
     and alleged, or alleged, about alleged, against alleged, into alleged, with alleged, by alleged, to alleged],
     hi: [कथित, कथित तौर पर, कथित रूप से]}
  # not "विशेष" alone: it is also "special" (विशेष गहन पुनरीक्षण = Special Intensive Revision)
  - {id: specific, strict: true, en: [specific, specifically, particular, particularly, exclusively],
     hi: [विशिष्ट, विशेष रूप से, विशेषकर, खास तौर पर, ख़ास तौर पर, खासकर, ख़ासकर]}   # not निश्चित: also "fixed"
  - {id: approximately, strict: false, number: true, en: [about, around, nearly, approximately, roughly, almost],
     hi: [लगभग, करीब, क़रीब, तकरीबन, तक़रीबन, आसपास]}
  - {id: hedge, strict: false, en: [might, could, can, possibly, probably, likely, perhaps],
     hi: [शायद, संभवतः, संभवत, संभावना, आशंका, सकता है, सकती है, सकते हैं]}
  - {id: reportedly, strict: false, en: [reportedly], hi: [बताया जाता है, सूत्रों के अनुसार, सूत्रों के मुताबिक]}

entities:
  - {en: [BJP, Bharatiya Janata Party], hi: [भाजपा, बीजेपी, भारतीय जनता पार्टी]}
  - {en: [Congress], hi: [कांग्रेस]}
  - {en: [AAP, Aam Aadmi Party], hi: [आम आदमी पार्टी]}       # not "आप": also "you"
  - {en: [Supreme Court, SC], hi: [सुप्रीम कोर्ट, सर्वोच्च न्यायालय, शीर्ष अदालत]}
  - {en: [High Court, HC], hi: [हाईकोर्ट, हाई कोर्ट, उच्च न्यायालय]}
  - {en: [Election Commission, EC, ECI], hi: [चुनाव आयोग, निर्वाचन आयोग]}
  - {en: [police], hi: [पुलिस]}
  - {en: [court], hi: [कोर्ट, अदालत, न्यायालय]}
  - {en: [Prime Minister, PM], hi: [प्रधानमंत्री, पीएम]}
  - {en: [Chief Minister, CM], hi: [मुख्यमंत्री, सीएम]}
  - {en: [CBI], hi: [सीबीआई]}
  - {en: [ED, Enforcement Directorate], hi: [ईडी, प्रवर्तन निदेशालय]}
  - {en: [Pakistan], hi: [पाकिस्तान]}
  - {en: [China], hi: [चीन]}
  - {en: [India], hi: [भारत]}

terms:
  - {en: criminal defamation, hi: आपराधिक मानहानि}
  - {en: anticipatory bail, hi: अग्रिम जमानत}
  - {en: chargesheet, hi: आरोपपत्र}
  - {en: charge sheet, hi: आरोपपत्र}
  - {en: FIR, hi: एफआईआर}
  - {en: monsoon session, hi: मानसून सत्र}
