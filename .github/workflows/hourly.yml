name: hourly-pipeline

# The newsroom hour (Oct 10 2026): the pipeline, then the writing desk, in ONE job, on a Postgres inside the
# job (the "newsroom", .github/scripts/newsroom.sh). It is loaded from the saved copy at the start and saved at
# the end; Supabase keeps only the readers' tables and the run logs (nishpaksh/db.py READER_TABLES), so the
# pipeline's reads no longer count against Supabase's 5 GB of free egress a month (it was used ~10x over).
# The pipeline and the desk used to be two jobs at :05 and :45 on one shared database; on a saved copy they
# must not overlap, so the desk now runs as soon as the pipeline finishes (pipeline 17 min on average, 31 at
# most; desk 7, at most 23: Oct 8-10 2026). Their own time budgets are unchanged.
#
# The order since Oct 29 2026 (owner): the DESK RUNS FIRST. A full run (the refill) can take over an hour, and for all of it
# nothing was published. Now the job starts by writing what is ready (after "priming" an almost empty pool), saves and
# publishes the feed at once, and only then runs the pipeline; the desk runs again after it for the seats still unused and the
# stories the pipeline made ready. The ready count that decides a light or a full run is therefore taken after the writing.
#
# Started every hour at :05 by Supabase (pg_cron -> workflow_dispatch, see supabase/migrations). The gate
# lets the Supabase trigger through only if no run has started recently. "Run workflow" (manual) always
# goes ahead.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "who started this run"
        default: "manual"

concurrency:
  group: nishpaksh-pipeline
  cancel-in-progress: false   # never two jobs on the newsroom copy at once

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "sqlalchemy>=2.0" "psycopg2-binary>=2.9" "pyyaml>=6.0"
      - id: check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}       # `runs` is on Supabase
          REASON: ${{ github.event.inputs.reason }}
        run: |
          reason="$REASON"
          if [ "$reason" = "supabase-cron" ]; then
            python -m nishpaksh.gate --min-gap 35 | tee -a "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"; echo "manual run: going ahead"
          fi

  run:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # Safety net only. The pipeline stops starting new work at 45 minutes and each desk run at 28; this limit
    # should never be what ends a healthy run. (110 -> 180 on Oct 29 2026: the job now holds two desk runs and two saves.)
    timeout-minutes: 180
    permissions:
      contents: write          # the newsroom backup, the archive and feed branches
      actions: write           # start the audio job when a reader asked for audio (audio.yml)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # the newsroom (this job's Postgres) and the readers (Supabase): nishpaksh/db.py routes each statement
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/newsroom
      READERS_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEWSROOM_KEY: ${{ secrets.NEWSROOM_KEY }}
      NEWSROOM_LOG_URL: ${{ secrets.DATABASE_URL }}    # loads and saves logged in Supabase diagnostics
      GH_TOKEN: ${{ github.token }}
      RUN_TRIGGER: ${{ github.event.inputs.reason || github.event_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Note when this job started
        # the gate spaces the hours by the start of the run; the pipeline now starts only after the first desk run, so
        # its `runs` row takes the start of the JOB (nishpaksh/run.py, RUN_STARTED_AT)
        run: echo "RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%S)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: ./.github/actions/nlp-setup
      - name: Find the newsroom copy in the cache
        uses: actions/cache/restore@v4
        with:
          path: .newsroom/cache
          key: newsroom-${{ github.run_id }}
          restore-keys: newsroom-
      - name: Load the newsroom
        id: restore
        run: bash .github/scripts/newsroom.sh restore
      - name: Prime an almost empty pool
        # fewer than `prime_below` stories ready: the best waiting stories are read and analysed BEFORE the first desk run, so it
        # has something to write. Nothing happens when the pool is fine. Never stops the hour.
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
        run: python -m nishpaksh.run --prime
      - name: Write and publish first (the desk)
        id: desk_first
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        continue-on-error: true      # a failed first desk run must not skip the pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}   # the Translator project's key: quality tier only (models.yaml keys)
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m nishpaksh.desk --minutes 28
      # What the first desk run wrote is saved and published NOW (only when it published something; if its output is missing,
      # the steps run). Same order and same safety as at the end: save first, then the copy, the feed, the notifications.
      - name: Save the newsroom (first desk run)
        id: save_first
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && steps.desk_first.outputs.published != '0' }}
        run: bash .github/scripts/newsroom.sh save
      - name: Keep the copy in the cache (first desk run)
        if: ${{ !cancelled() && steps.save_first.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: .newsroom/cache
          key: newsroom-${{ github.run_id }}-${{ github.run_attempt }}-first
      - name: Copy the live articles to Supabase (first desk run)
        if: ${{ !cancelled() && steps.save_first.outcome == 'success' }}
        continue-on-error: true
        run: python -m nishpaksh.mirror
      - name: Publish the feed (first desk run)
        id: feed_first
        if: ${{ !cancelled() && steps.save_first.outcome == 'success' }}
        continue-on-error: true
        run: bash .github/scripts/publish_feed.sh
      - name: Send notifications (first desk run)
        if: ${{ !cancelled() && steps.save_first.outcome == 'success' && steps.feed_first.outcome == 'success' }}
        continue-on-error: true
        run: python -m nishpaksh.notify --send-only
      - name: Run pipeline
        id: pipeline
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}   # the Translator project's key: quality tier only (models.yaml keys)
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python -m nishpaksh.run --time-budget 55
      - name: Move articles older than 3 days to the archive branch
        # a story leaves the newsroom only after its page is pushed (nishpaksh/pagearchive.py)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: bash .github/scripts/archive_pages.sh
      - name: Write and publish again (the desk)
        # the second run only has to publish ONE article, the smallest ready story, with no time limit (owner, Oct 30 2026)
        # only after a FULL run (a refill, owner Oct 29 2026): the seats the first run left unused and the stories the refill has
        # just made ready. After a light run the first run has used the seats and the next hour's first run takes what is new.
        # If the pipeline failed or left no answer, this step runs as well.
        id: desk
        if: ${{ !cancelled() && steps.restore.outcome == 'success' && steps.pipeline.outputs.light != 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}   # the Translator project's key: quality tier only (models.yaml keys)
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m nishpaksh.desk --fill
      - name: Write the ledger
        # one record of this run (embedding use, outlet yield, the express lane's funnel) into ledger/, committed to
        # the branch (nishpaksh/ledger.py). Reads only; before the newsroom is saved so it sees this hour's data.
        # Never stops the hour.
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        continue-on-error: true
        run: bash .github/scripts/ledger.sh
      - name: Save the newsroom
        # always, once a copy was loaded: whatever this hour did is kept, even after a failed step
        id: save
        if: ${{ always() && steps.restore.outcome == 'success' }}
        run: bash .github/scripts/newsroom.sh save
      - name: Keep the copy in the cache
        if: ${{ always() && steps.save.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: .newsroom/cache
          key: newsroom-${{ github.run_id }}-${{ github.run_attempt }}
      # Everything below runs only once this hour's work is safely saved: an article shown on the site but lost
      # from the newsroom would be written and published a second time next hour.
      - name: Copy the live articles to Supabase
        # the site's fallback and the audio job read them there; writing costs no egress (nishpaksh/mirror.py)
        if: ${{ always() && steps.save.outcome == 'success' }}
        continue-on-error: true
        run: python -m nishpaksh.mirror
      - name: Publish the feed for the reading site
        id: feed
        if: ${{ always() && steps.save.outcome == 'success' }}
        continue-on-error: true
        run: bash .github/scripts/publish_feed.sh
      - name: Send notifications
        # after the feed, so the article is on the home page when the reader taps (owner, Oct 10 2026); and only if the
        # feed was published (Oct 29 2026: a failed feed step still let the pushes go out, for articles with no picture
        # and not on the home page). Unsent notifications stay queued and go out with the next hour's feed.
        if: ${{ always() && steps.save.outcome == 'success' && steps.feed.outcome == 'success' }}
        continue-on-error: true
        run: python -m nishpaksh.notify --send-only
      - name: Start the audio job if a reader is waiting
        if: ${{ always() && steps.save.outcome == 'success' }}
        continue-on-error: true
        run: |
          if python -m nishpaksh.audio --dir audio-out --check; then gh workflow run audio.yml -f reason=desk; fi
