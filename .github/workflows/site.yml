name: site

# Publishes the reading site (site/) to GitHub Pages whenever it changes.
# The page reads published stories straight from Supabase, so it needs no rebuild
# when news changes, only when the page itself changes. The share pages (link previews, nishpaksh/sharepages.py) are
# the exception: the hourly job starts this workflow after it publishes the feed (publish_feed.sh).
on:
  push:
    branches: [main]
    paths: ["site/**", "live/**", ".github/workflows/site.yml", ".github/scripts/build_site.sh"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: The site, its audio and the share pages (build_site.sh)
        run: bash .github/scripts/build_site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
