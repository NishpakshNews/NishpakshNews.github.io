name: story-export
# Read-only: loads the saved (encrypted) newsroom copy into the job's own Postgres, exports one story's
# claims / canonical statements / published article as JSON, and attaches it to the run as a PRIVATE
# artifact (not committed: the repository is public). Nothing is saved back.
on:
  workflow_dispatch:
    inputs:
      title:
        description: "Word in the headline"
        default: "Hyundai"
      since:
        description: "Articles published on or after (YYYY-MM-DD)"
        default: "2026-10-12"
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: ./.github/actions/newsroom-load
        env:
          NEWSROOM_KEY: ${{ secrets.NEWSROOM_KEY }}
          GH_TOKEN: ${{ github.token }}
      - env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/newsroom
        run: python -m nishpaksh.tools.export_story --title "${{ github.event.inputs.title }}" --since "${{ github.event.inputs.since }}" --out story.json
      - uses: actions/upload-artifact@v4
        with:
          name: story-export
          path: story.json
          retention-days: 3
