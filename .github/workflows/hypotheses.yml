name: hypotheses
# Read-only measurements for the hypothesis list in NOTES.md (group A: tests that need only stored data). Loads the saved
# (encrypted) newsroom copy into the job's own Postgres, reads the last N days of published stories, statements,
# analysis records, thread links and (through the readers' database, read only) the positions diagnostics and run
# stats, and attaches hypotheses.json (counts + short examples) and hypotheses.md (one summary line per test) to the run
# as a PRIVATE artifact. Nothing is saved back, no model is called, and nothing is printed to the job log (the
# repository is public). Same privacy as story-export: statements and our own sentences, never article bodies.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Published in the last N days"
        default: "14"
      only:
        description: "Only these tests (comma list, e.g. H22,H42; empty = all)"
        default: ""
permissions:
  contents: read
jobs:
  hypotheses:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: ./.github/actions/newsroom-load
        env:
          NEWSROOM_KEY: ${{ secrets.NEWSROOM_KEY }}
          GH_TOKEN: ${{ github.token }}
      - env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/newsroom
          READERS_DATABASE_URL: ${{ secrets.DATABASE_URL }}      # read only: diagnostics (positions) and runs
          DAYS: ${{ github.event.inputs.days || '14' }}
          ONLY: ${{ github.event.inputs.only }}
        run: python -m nishpaksh.tools.hypotheses --days "$DAYS" --only "$ONLY" --out hypotheses.json --md hypotheses.md
      - uses: actions/upload-artifact@v4
        with:
          name: hypotheses
          path: |
            hypotheses.json
            hypotheses.md
          retention-days: 3
