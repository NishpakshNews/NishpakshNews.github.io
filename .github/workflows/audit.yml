name: audit
# Read-only audits of the live articles (nishpaksh/audit.py, nishpaksh/tools/audit.py): missed merges by the language mix
# of a story's sources, English left in Hindi pages, repeated sentence openings, mixed date / money / per-cent forms.
# No model call, nothing changed; the summary goes to the diagnostics table (kind 'audit').
on:
  workflow_dispatch:
    inputs:
      tool:
        description: "Which read-only report"
        type: choice
        options: [audit, express_review, story_check]
        default: audit
      args:
        description: "Arguments for the tool (story_check: story ids)"
        default: ""
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:            # the newsroom, loaded read-only from the saved copy (.github/actions/newsroom-load)
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: ./.github/actions/newsroom-load
        env:
          NEWSROOM_KEY: ${{ secrets.NEWSROOM_KEY }}
          GH_TOKEN: ${{ github.token }}
      - env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/newsroom
          READERS_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m nishpaksh.tools.${{ github.event.inputs.tool || 'audit' }} ${{ github.event.inputs.args }}
