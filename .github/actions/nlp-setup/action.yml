name: Language-model libraries
description: >-
  Installs requirements-nlp.txt (torch CPU, transformers, sentence-transformers, spaCy, rapidfuzz), the spaCy English model,
  and downloads the Hugging Face model files (NLI cross-encoder, multilingual embedder) from the Hub with retries
  (.github/scripts/fetch_models.py). Nothing is kept in the Actions cache: restoring ~1.6 GB of cache every hour was
  slow when it worked and stalled for minutes when the cache service throttled (Oct 30 2026).
runs:
  using: composite
  steps:
    - run: pip install -q -r requirements-nlp.txt
      shell: bash
    - run: python -m spacy download en_core_web_lg || python -m spacy download en_core_web_sm || true
      shell: bash
    - run: python -m spacy download en_core_web_sm || true
      shell: bash
    - name: Download the language models
      shell: bash
      run: python .github/scripts/fetch_models.py
